version: '3.8'

services:
  wellpro-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wellpro_copilot_backend
    ports:
      - "8080:8080"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3